<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Удаление телефона</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 40px; }
        button { padding: 12px 24px; background: #ff4444; color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
        button:hover { background: #cc0000; }
        #status { margin-top: 20px; font-size: 20px; }
    </style>
</head>
<body>
    <h1>Удаление телефона</h1>
    <p>Нажмите кнопку, чтобы начать процесс удаления.</p>
    <button onclick="deletePhone()">🗑️ Удалить телефон</button>
    <div id="status"></div>

    <script>
        function deletePhone() {
            const status = document.getElementById('status');
            status.innerHTML = '⏳ Подготовка...';
            setTimeout(() => {
                status.innerHTML = '📦 Создание резервной копии...';
            }, 1000);
            setTimeout(() => {
                status.innerHTML = '🧹 Очистка данных...';
            }, 2000);
            setTimeout(() => {
                status.innerHTML = '🔄 Сброс до заводских настроек...';
            }, 3000);
            setTimeout(() => {
                status.innerHTML = '✅ Телефон успешно удалён.';
            }, 4000);
        }
    </script>
</body>
</html>
