<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Удаление телефона</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.8s;
        }
        .container {
            background: #111;
            padding: 30px 24px;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 0 50px rgba(0,255,0,0.05);
            border: 1px solid #2a2a2a;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            color: #ff4444;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .sub {
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 12px;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            margin: 16px 0;
            border: 1px solid #2a2a2a;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ff4444;
            border-radius: 10px;
            transition: width 0.3s;
        }
        #log {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            text-align: left;
            color: #66bb6a;
            border: 1px solid #1a2a1a;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }
        #log .del { color: #ff6b6b; }
        #log .code { color: #ffd93d; }
        #log .sys { color: #4fc3f7; }
        #btnContainer {
            margin-top: 18px;
        }
        button {
            padding: 14px 32px;
            background: #ff4444;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(255,68,68,0.3);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        button:active { transform: scale(0.96); }
        .hidden { display: none; }
        .blackout {
            background: #000 !important;
        }
        .blackout .container {
            background: #000 !important;
            border: none !important;
            box-shadow: none !important;
        }
        .blackout .container * {
            opacity: 0 !important;
            transition: opacity 0.1s;
        }
        .blackout .container .power-off {
            opacity: 1 !important;
            color: #222;
            font-size: 14px;
            text-align: center;
            margin-top: 30px;
            font-family: 'Courier New', monospace;
        }
        .power-off {
            display: none;
        }
        .blackout .power-off {
            display: block !important;
        }
        .percent {
            font-size: 22px;
            font-weight: bold;
            color: #ff4444;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="container" id="container">
    <h1>⚠️ УДАЛЕНИЕ ТЕЛЕФОНА</h1>
    <div class="sub">Полная очистка всех данных. Это действие необратимо.</div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="percent" id="percentDisplay">0%</div>

    <div id="log">
        <div class="sys">> Система готова к удалению.</div>
    </div>

    <div id="btnContainer">
        <button id="deleteBtn">🗑️ УДАЛИТЬ</button>
    </div>
    <div class="power-off" id="powerOffMsg">⏻ УСТРОЙСТВО ВЫКЛЮЧЕНО</div>
</div>

<script>
    // ===== ДАННЫЕ =====
    const systemFiles = [
        "/system/bin/sh",
        "/system/lib/libc.so",
        "/data/data/com.android.providers.contacts/databases/contacts.db",
        "/data/data/com.android.providers.telephony/databases/mmssms.db",
        "/data/data/com.google.android.gms/shared_prefs/",
        "/data/data/com.android.vending/cache/",
        "/storage/emulated/0/DCIM/Camera/IMG_20240908_1423.jpg",
        "/storage/emulated/0/Download/file_001.pdf",
        "/storage/emulated/0/Music/audio_01.mp3",
        "/storage/emulated/0/Android/data/com.whatsapp/files/",
        "/storage/emulated/0/Pictures/Screenshots/Screenshot_20240907.png",
        "/data/dalvik-cache/",
        "/cache/recovery/",
        "/system/build.prop",
        "/vendor/etc/audio_policy.conf"
    ];

    const codeSnippets = [
        "void wipe_data() { erase(0x0000, 0xFFFF); }",
        "rm -rf /data/*",
        "dd if=/dev/zero of=/dev/block/sda bs=4M",
        "format(\"system\")",
        "System.exit(0);",
        "factory_reset() -> OK",
        "Bootloader unlocked.",
        "Verifying erased blocks...",
        "Erasing EFS partition...",
        "Resetting modem config..."
    ];

    // ===== СОСТОЯНИЕ =====
    let isDeleting = false;
    let progress = 0;
    const logEl = document.getElementById('log');
    const progressFill = document.getElementById('progressFill');
    const percentDisplay = document.getElementById('percentDisplay');
    const deleteBtn = document.getElementById('deleteBtn');
    const container = document.getElementById('container');

    function addLog(msg, type = 'sys') {
        const div = document.createElement('div');
        div.className = type;
        div.textContent = '> ' + msg;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function updateProgress(value) {
        progress = Math.min(value, 100);
        progressFill.style.width = progress + '%';
        percentDisplay.textContent = progress + '%';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ===== ПРОЦЕСС УДАЛЕНИЯ =====
    async function startDeletion() {
        if (isDeleting) return;
        isDeleting = true;
        deleteBtn.disabled = true;
        deleteBtn.textContent = '⏳ УДАЛЕНИЕ...';

        setTimeout(() => {
            deleteBtn.style.display = 'none';
        }, 1500);

        addLog('Подготовка к удалению...', 'sys');
        updateProgress(2);
        await sleep(400);

        for (let i = 0; i < systemFiles.length; i++) {
            const file = systemFiles[i];
            const pct = 10 + Math.floor((i / systemFiles.length) * 60);
            updateProgress(pct);
            addLog(`Удаление ${file}...`, 'del');
            await sleep(150 + Math.random() * 250);

            if (Math.random() > 0.6) {
                const snippet = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                addLog(`>> ${snippet}`, 'code');
                await sleep(100);
            }
        }

        updateProgress(75);
        addLog('Очистка кэша приложений...', 'sys');
        await sleep(500);
        addLog('Удаление временных файлов...', 'sys');
        await sleep(400);
        updateProgress(85);

        addLog('Сброс заводских настроек...', 'sys');
        await sleep(600);
        addLog('>> factory_reset() -> OK', 'code');
        updateProgress(92);

        addLog('Перезапись свободного пространства...', 'sys');
        await sleep(500);
        updateProgress(98);
        addLog('Удаление ключей шифрования...', 'sys');
        await sleep(300);

        updateProgress(100);
        addLog('✅ Удаление завершено.', 'sys');
        await sleep(400);

        // ЧЁРНЫЙ ЭКРАН
        document.body.classList.add('blackout');
        container.classList.add('blackout');
        document.body.style.background = '#000';
    }

    // ===== АВТОНАЖАТИЕ =====
    setTimeout(() => {
        const btn = document.getElementById('deleteBtn');
        if (btn && !isDeleting) {
            btn.click();
        }
    }, 2000);

    // ===== СОБЫТИЕ =====
    deleteBtn.addEventListener('click', startDeletion);
</script>
</body>
</html>
